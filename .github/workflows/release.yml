name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: core
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Validate package release ages
        run: node scripts/verify-package-release-ages.js --days 7

      - name: Pin npm
        run: npm install --global npm@11.18.0 --ignore-scripts
        working-directory: ${{ runner.temp }}

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Run tests
        run: npm run test:run

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Sourcemaps stay in the build, for debugging, but out of the zips.
          (cd dist && zip -r "../dusk-wallet-chrome-${VERSION}.zip" . -x '*.map')
          (cd dist-firefox && zip -r "../dusk-wallet-firefox-${VERSION}.zip" . -x '*.map')

      - name: Create GitHub release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          generate_release_notes: true
          files: |
            dusk-wallet-chrome-${{ github.ref_name }}.zip
            dusk-wallet-firefox-${{ github.ref_name }}.zip
