name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  build-test:
    runs-on: core
    timeout-minutes: 20
    # Do not expose the self-hosted core runner to fork PRs, and skip draft PRs.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) }}
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Validate package release ages
        run: node scripts/verify-package-release-ages.js --days 0.5

      - name: Pin npm
        run: npm install --global npm@11.18.0 --ignore-scripts
        working-directory: ${{ runner.temp }}

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Run tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox

  typed-data-renderer:
    # The minimal core runner cannot install Chromium's system libraries.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) }}
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Validate package release ages
        run: node scripts/verify-package-release-ages.js --days 0.5

      - name: Pin npm
        run: npm install --global npm@11.18.0 --ignore-scripts
        working-directory: ${{ runner.temp }}

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify registry signatures
        run: npm audit signatures

      # Chromium comes from Playwright's own download, its system packages from
      # apt. An Ubuntu mirror that stopped resolving once held apt for the
      # job's 10 minutes; the image already has every library Chromium needs
      # (apt adds fonts), so apt gets 3 minutes and the tests go on past that.
      - name: Install Chromium for the renderer tests
        timeout-minutes: 4
        run: |
          npx --no-install playwright install chromium
          timeout -k 10 180 npx --no-install playwright install-deps chromium \
            || echo "::warning title=Chromium's system packages::apt didn't install them within 3 minutes; the tests run with the runner image's own."

      # A run that hangs ends itself well inside the job (playwright.config.js).
      - name: Run approval and unlock renderer tests
        timeout-minutes: 4
        run: npm run e2e -- typed-data-preview.spec.js unlock-form.spec.js approval-windows.spec.js phone.spec.js --workers=1
