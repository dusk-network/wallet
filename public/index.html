<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dusk Wallet</title>
    <link rel="stylesheet" href="ui.css" />
  </head>

  <body class="page--full">
    <div class="full-wrap">
      <div class="panel">
        <header class="panel-header">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <img class="brand-mark__glyph" src="icons/dusk-glyph.svg" alt="" />
            </div>
            <div class="brand-text">
              <div class="panel-title">Dusk Wallet</div>
            </div>
            <button
              class="panel-subtitle network-pill"
              id="network-pill"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <span class="network-pill__label">Loading…</span>
              <span class="network-pill__chev" aria-hidden="true">▾</span>
            </button>
          </div>

          <nav class="full-nav" aria-label="Wallet">
            <button class="full-nav-item" type="button" data-route="home">Dashboard</button>
            <button class="full-nav-item" type="button" data-route="activity">Activity</button>
            <button class="full-nav-item" type="button" data-route="send">Send</button>
            <button class="full-nav-item" type="button" data-route="receive">Receive</button>
            <button class="full-nav-item" type="button" data-route="convert">Shield</button>
            <button class="full-nav-item" type="button" data-route="stake">Stake</button>
            <button class="full-nav-item" type="button" data-route="contacts">Contacts</button>
          </nav>

          <div class="header-actions" id="header-actions"></div>
        </header>

        <main class="panel-content">
          <div id="app"></div>
        </main>
      </div>
    </div>

    <!-- For the extension, this is also used by full.html/popup.html. For Tauri desktop/mobile, it's convenient to have a default index.html. -->

    <script type="module" src="popup.js"></script>
  </body>
</html>
